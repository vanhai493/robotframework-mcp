[project]
name = "robotframework-mcp"
version = "2.0.0"
description = "Robot Framework MCP Server for test automation code generation"
authors = [
    {name = "Meenu Rani", email = "meenu.rani@sourcefuse.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "mcp",
    "selenium",
    "testing",
    "robot-framework",
    "automation",
    "test-generation",
    "appium",
    "api-testing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.0.0",
    "robotframework>=6.0",
    "selenium>=4.0.0",
    "robotframework-seleniumlibrary>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]
mobile = [
    "robotframework-appiumlibrary>=2.0.0",
]
api = [
    "robotframework-requests>=0.9.0",
]
database = [
    "robotframework-databaselibrary>=1.2.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.0.0",
]
all = [
    "robotframework-mcp[dev,mobile,api,database]",
]

[project.scripts]
robotframework-mcp = "src.server:main"

[project.urls]
Homepage = "https://github.com/sourcefuse/robotframework-MCP"
Repository = "https://github.com/sourcefuse/robotframework-MCP.git"
Issues = "https://github.com/sourcefuse/robotframework-MCP/issues"
Documentation = "https://github.com/sourcefuse/robotframework-MCP#readme"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.templates"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.json", "*.js", "*.bat", "bin/*", "scripts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "build/",
    "dist/",
]

[tool.flake8]
max-line-length = 100
exclude = [".git", ".venv", "build", "dist", "__pycache__"]
ignore = ["E501", "W503"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
